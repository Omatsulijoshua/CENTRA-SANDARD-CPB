name: central_stadard_cpb
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  device_preview: ^1.1.0
  qr_flutter: ^4.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  local_auth: ^2.3.0

  # Icons
  iconsax: ^0.0.8

  # Networking
  http: ^1.1.0

  # Animations & Sharing
  share_plus: 12.0.1
  lottie: ^3.3.2

  # Barcode scanner
  mobile_scanner: ^7.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/wifi.png
    - assets/card-design.png
    - assets/logo.png
    - assets/profile.jpg
    - assets/Payment_Successfull.json
